<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Kullanım Kılavuzu · Plaka Tanıma Sistemi</title>
<link href="/static/vendor/bootstrap/bootstrap.min.css" rel="stylesheet">
<link href="/static/vendor/bootstrap-icons/bootstrap-icons.min.css" rel="stylesheet">
<link href="/static/vendor/ibm-plex-sans/ibm-plex-sans.css" rel="stylesheet">
<!-- KULLANIM KILAVUZU (2026-10-30): /kilavuz adresinden açılır; kenar çubuğundaki
     "Kullanım Kılavuzu" ve Kapı Modu'ndaki "Kılavuz" bağlantıları buraya gelir.
     Kurum adı ve logo /marka'dan okunur. Ekrana yeni özellik eklenince buraya da eklenmeli. -->
<style>
  :root { --mavi: #1f4fd8; --koyu: #0f1b3d; --soluk: #5b6576; --cizgi: #e3e7ee; --zemin: #f4f6fa; }
  body { font-family: "IBM Plex Sans", system-ui, sans-serif; background: var(--zemin); color: #1c2333; }
  .ust { background: var(--koyu); color: #fff; padding: 14px 0; position: sticky; top: 0; z-index: 20; }
  .ust .logo { height: 38px; background: #fff; border-radius: 8px; padding: 3px 8px; }
  .ust h1 { font-size: 20px; margin: 0; font-weight: 600; }
  .ust .alt { font-size: 13px; color: #b9c3dc; }
  .ust .ara { max-width: 340px; }
  .icindekiler { position: sticky; top: 86px; max-height: calc(100vh - 100px); overflow-y: auto; font-size: 14px; padding-right: 6px; }
  .icindekiler a { display: block; color: #334; text-decoration: none; padding: 4px 10px; border-radius: 6px; border-left: 3px solid transparent; }
  .icindekiler a.h3 { padding-left: 24px; font-size: 13px; color: var(--soluk); }
  .icindekiler a:hover { background: #e8edf8; }
  .icindekiler a.aktif { border-left-color: var(--mavi); background: #e8edf8; color: var(--mavi); font-weight: 600; }
  main section { background: #fff; border: 1px solid var(--cizgi); border-radius: 14px; padding: 26px 30px; margin-bottom: 22px; }
  main h2 { font-size: 24px; font-weight: 700; margin-bottom: 6px; scroll-margin-top: 90px; }
  main h3 { font-size: 18px; font-weight: 700; margin: 26px 0 8px; scroll-margin-top: 90px; }
  main h4 { font-size: 15px; font-weight: 700; margin: 18px 0 6px; }
  main p, main li { line-height: 1.65; }
  .ozet { color: var(--soluk); margin-bottom: 14px; }
  .rol { display: inline-block; font-size: 12px; font-weight: 600; padding: 2px 9px; border-radius: 999px; margin-left: 6px; vertical-align: middle; }
  .rol-herkes { background: #e6f4ea; color: #1e6b34; }
  .rol-gorevli { background: #e7efff; color: #1d3f9e; }
  .rol-yonetici { background: #fde8e8; color: #9b1c1c; }
  .rol-modul { background: #fff4d6; color: #8a5a00; }
  .ipucu, .dikkat { border-radius: 10px; padding: 12px 16px; margin: 14px 0; font-size: 15px; }
  .ipucu { background: #eef4ff; border-left: 4px solid var(--mavi); }
  .dikkat { background: #fff6e5; border-left: 4px solid #d98a00; }
  .adim { counter-reset: adim; list-style: none; padding-left: 0; }
  .adim > li { counter-increment: adim; position: relative; padding-left: 40px; margin-bottom: 8px; }
  .adim > li::before { content: counter(adim); position: absolute; left: 0; top: 1px; width: 26px; height: 26px; border-radius: 50%;
    background: var(--mavi); color: #fff; font-size: 13px; font-weight: 700; display: flex; align-items: center; justify-content: center; }
  .dugme { display: inline-block; background: #eef1f6; border: 1px solid #cfd6e2; border-radius: 6px; padding: 0 7px; font-size: 14px; font-weight: 600; white-space: nowrap; }
  table.tablo { width: 100%; font-size: 15px; margin: 10px 0 16px; }
  table.tablo th { background: #f1f4f9; font-weight: 600; }
  table.tablo th, table.tablo td { border: 1px solid var(--cizgi); padding: 8px 10px; vertical-align: top; }
  .renk { display: inline-block; width: 12px; height: 12px; border-radius: 3px; margin-right: 6px; vertical-align: -1px; }
  mark { background: #ffe58a; padding: 0 1px; }
  .bos-arama { display: none; }
  details { border: 1px solid var(--cizgi); border-radius: 10px; padding: 10px 16px; margin-bottom: 10px; }
  details summary { font-weight: 600; cursor: pointer; }
  details[open] summary { margin-bottom: 8px; }
  @media print {
    .ust, .icindekiler-kolon, .yazdir-yok { display: none !important; }
    main section { border: 0; padding: 0; break-inside: auto; }
    body { background: #fff; }
    details { border: 0; } details > * { display: block !important; }
  }
</style>
</head>
<body>
<header class="ust">
  <div class="container-xl d-flex align-items-center gap-3 flex-wrap">
    <img class="logo" id="kurumLogo" src="/static/img/tpao-logo.png" alt="Kurum logosu">
    <div class="me-auto">
      <h1>Kullanım Kılavuzu</h1>
      <div class="alt" id="kurumAdi">Plaka Tanıma Sistemi</div>
    </div>
    <input type="search" class="form-control ara" id="kilavuzAra" placeholder="Kılavuzda ara: not, ziyaretçi, rapor…" aria-label="Kılavuzda ara">
    <button class="btn btn-outline-light btn-sm" onclick="window.print()"><i class="bi bi-printer"></i> Yazdır</button>
    <a class="btn btn-light btn-sm" href="/"><i class="bi bi-arrow-left"></i> Sisteme dön</a>
  </div>
</header>

<div class="container-xl py-4">
  <div class="row g-4">
    <div class="col-lg-3 icindekiler-kolon d-none d-lg-block"><nav class="icindekiler" id="icindekiler" aria-label="İçindekiler"></nav></div>
    <main class="col-lg-9" id="icerik">
      <div class="alert alert-warning bos-arama" id="bosArama">Aramanızla eşleşen bölüm yok.</div>

      <div class="text-muted p-4" id="kilavuzYukleniyor">Kılavuz yükleniyor…</div>
    </main>
  </div>
</div>

<script>
(function () {
  // Kurum adı / logo
  fetch("/marka").then(r => r.ok ? r.json() : null).then(m => {
    if (!m) return;
    document.getElementById("kurumAdi").textContent = [m.kurum_adi, m.uygulama_adi].filter(Boolean).join(" · ");
    if (m.logo_url) document.getElementById("kurumLogo").src = m.logo_url;
    if (m.logo_alt) document.getElementById("kurumLogo").alt = m.logo_alt;
    const ilt = m.iletisim;
    if (ilt) {
      const el = document.getElementById("iletisimBilgisi");
      el.textContent = typeof ilt === "string" ? ilt : Object.values(ilt).filter(Boolean).join(" · ");
      el.classList.toggle("d-none", !el.textContent);
    }
  }).catch(() => {});

  // Metin sunucudan, rolünüze göre süzülmüş gelir (bkz. main.py::kilavuz_icerik):
  // oturum bu sekmede yoksa açan sekmeden kopyalanmış olabilir; yoksa genel metin.
  let token = null;
  try { token = sessionStorage.getItem("pts_token"); } catch (e) { /* yok */ }
  fetch("/kilavuz/icerik", { headers: token ? { Authorization: `Bearer ${token}` } : {} })
    .then(r => r.ok ? r.json() : Promise.reject(r.status))
    .then(v => {
      const yer = document.getElementById("kilavuzYukleniyor");
      yer.insertAdjacentHTML("afterend", (v.rol_aciklama
        ? `<div class="alert alert-light border small yazdir-yok">${v.rol_aciklama}</div>` : "") + v.html);
      yer.remove();
      kur();
      if (location.hash) document.getElementById(location.hash.slice(1))?.scrollIntoView();
    })
    .catch(() => { document.getElementById("kilavuzYukleniyor").textContent = "Kılavuz yüklenemedi. Sayfayı yenileyin."; });

  function kur() {
  // Bölüm numaraları görünen bölümlere göre (yetkiye göre çıkan bölüm numarayı atlatmasın).
  document.querySelectorAll("main section > h2").forEach((h, i) => {
    h.childNodes[0].textContent = h.childNodes[0].textContent.replace(/^\s*\d+\.\s*/, `${i + 1}. `);
  });
  // İçindekiler
  const nav = document.getElementById("icindekiler");
  const basliklar = [...document.querySelectorAll("main h2, main h3[id]")];
  document.querySelectorAll("main section").forEach(s => { const h = s.querySelector("h2"); if (h && !h.id) h.id = s.id + "-baslik"; });
  nav.innerHTML = basliklar.map(h => {
    const hedef = h.tagName === "H2" ? h.closest("section").id : h.id;
    const metin = h.childNodes[0].textContent.trim();
    return `<a href="#${hedef}" class="${h.tagName === "H3" ? "h3" : ""}" data-hedef="${hedef}">${metin}</a>`;
  }).join("");
  // Okunan bölüm: üst çubuğun hemen altını geçen son başlık.
  let isaretli = null;
  function icindekilerGuncelle() {
    let son = basliklar[0];
    for (const h of basliklar) {
      if (h.offsetParent === null) continue;  // aramada gizlenen bölüm
      if (h.getBoundingClientRect().top <= 130) son = h; else break;
    }
    const id = son.tagName === "H2" ? son.closest("section").id : son.id;
    if (id === isaretli) return;
    isaretli = id;
    nav.querySelectorAll("a").forEach(a => a.classList.toggle("aktif", a.dataset.hedef === id));
    nav.querySelector("a.aktif")?.scrollIntoView({ block: "nearest" });
  }
  window.addEventListener("scroll", icindekilerGuncelle, { passive: true });
  window.addEventListener("load", icindekilerGuncelle);
  window.addEventListener("hashchange", () => setTimeout(icindekilerGuncelle, 50));

  // Arama: eşleşmeyen bölümleri gizler, eşleşmeleri işaretler.
  const sade = m => m.toLocaleLowerCase("tr-TR");
  const bolumler = [...document.querySelectorAll("main section")];
  const orijinal = new Map(bolumler.map(b => [b, b.innerHTML]));
  let zaman = null;
  document.getElementById("kilavuzAra").addEventListener("input", e => {
    clearTimeout(zaman);
    zaman = setTimeout(() => {
      const aranan = sade(e.target.value.trim());
      let gorunen = 0;
      bolumler.forEach(b => {
        b.innerHTML = orijinal.get(b);
        if (!aranan) { b.classList.remove("d-none"); gorunen++; return; }
        const var_ = sade(b.textContent).includes(aranan);
        b.classList.toggle("d-none", !var_);
        if (!var_) return;
        gorunen++;
        b.querySelectorAll("details").forEach(d => { if (sade(d.textContent).includes(aranan)) d.open = true; });
        const yuruyucu = document.createTreeWalker(b, NodeFilter.SHOW_TEXT);
        const dugumler = [];
        while (yuruyucu.nextNode()) dugumler.push(yuruyucu.currentNode);
        dugumler.forEach(d => {
          const i = sade(d.nodeValue).indexOf(aranan);
          if (i < 0) return;
          const isaret = document.createElement("mark");
          const orta = d.splitText(i);
          orta.splitText(aranan.length);
          isaret.textContent = orta.nodeValue;
          orta.replaceWith(isaret);
        });
      });
      document.getElementById("bosArama").style.display = gorunen ? "none" : "block";
      const ilk = document.querySelector("main mark");
      if (ilk) ilk.scrollIntoView({ block: "center" });
    }, 250);
  });
  icindekilerGuncelle();
  }
})();
</script>
</body>
</html>
