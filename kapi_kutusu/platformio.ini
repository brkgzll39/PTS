; PTS Kapı Kutusu -- KinCony KC868-A8 yazılımı.
; Derleme:   pio run
; Karta yükleme (USB):   pio run -t upload
; Seri ekran:   pio device monitor
[env:kc868_a8]
platform = espressif32@6.9.0
board = esp32dev
framework = arduino
monitor_speed = 115200
; Ağdan güncelleme için iki eşit uygulama bölümü gerekir; varsayılan tabloda her
; biri 1,25 MB'tır ve TLS + web sunucusuyla sınırda kalır. min_spiffs: 2 x 1,9 MB.
; (Bölüm tablosu değişirse karta bir kez USB ile tam.bin yazılmalıdır.)
board_build.partitions = min_spiffs.csv
build_flags = -std=gnu++17 -Wall
build_unflags = -std=gnu++11
