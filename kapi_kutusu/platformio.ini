; PTS Kapı Kutusu -- KinCony KC868-A8 yazılımı.
; Derleme:   pio run
; Karta yükleme (USB):   pio run -t upload
; Seri ekran:   pio device monitor
[env:kc868_a8]
platform = espressif32@6.9.0
board = esp32dev
framework = arduino
monitor_speed = 115200
build_flags = -std=gnu++17 -Wall
build_unflags = -std=gnu++11
